<div class="admin-page">
  <div class="admin-page__header">
    <h2>{{ 'PRODUCT_MASTER' | translate }}</h2>
    <button mat-flat-button class="fp-btn-primary" (click)="goToAdd()">
      <mat-icon>add</mat-icon> {{ 'ADD_PRODUCT' | translate }}
    </button>
  </div>

  <table mat-table [dataSource]="products()" class="fp-card admin-table" *ngIf="!loading()">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>{{ 'PRODUCT_NAME' | translate }}</th>
      <td mat-cell *matCellDef="let p">{{ p.productName }}</td>
    </ng-container>
    <ng-container matColumnDef="brand">
      <th mat-header-cell *matHeaderCellDef>{{ 'BRAND' | translate }}</th>
      <td mat-cell *matCellDef="let p">{{ p.brandName }}</td>
    </ng-container>
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>{{ 'CATEGORY' | translate }}</th>
      <td mat-cell *matCellDef="let p">{{ p.categoryName }}</td>
    </ng-container>
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>{{ 'PRODUCT_PRICE' | translate }}</th>
      <td mat-cell *matCellDef="let p">₹{{ p.mrp }}</td>
    </ng-container>
    <ng-container matColumnDef="stock">
      <th mat-header-cell *matHeaderCellDef>{{ 'STOCK' | translate }}</th>
      <td mat-cell *matCellDef="let p">{{ p.stockQty }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let p">
        <button mat-icon-button aria-label="Edit" (click)="goToEdit(p)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button aria-label="Delete"><mat-icon>delete_outline</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>
