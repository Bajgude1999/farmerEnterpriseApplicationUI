<div class="admin-page">
  <div class="admin-page__header">
    <h2>{{ 'GOODS_RECEIPT_NOTE' | translate }}</h2>
    <button mat-flat-button class="fp-btn-primary">
      <mat-icon>add</mat-icon> {{ 'NEW_GRN' | translate }}
    </button>
  </div>

  <table mat-table [dataSource]="rows()" class="fp-card admin-table" *ngIf="!loading()">
    <ng-container matColumnDef="grnNumber">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRN_NUMBER' | translate }}</th>
      <td mat-cell *matCellDef="let r">{{ r.grnNumber }}</td>
    </ng-container>
    <ng-container matColumnDef="supplierName">
      <th mat-header-cell *matHeaderCellDef>{{ 'SUPPLIER_NAME' | translate }}</th>
      <td mat-cell *matCellDef="let r">{{ r.supplierName }}</td>
    </ng-container>
    <ng-container matColumnDef="receivedDate">
      <th mat-header-cell *matHeaderCellDef>{{ 'RECEIVED_DATE' | translate }}</th>
      <td mat-cell *matCellDef="let r">{{ r.receivedDate | date: 'mediumDate' }}</td>
    </ng-container>
    <ng-container matColumnDef="totalItems">
      <th mat-header-cell *matHeaderCellDef>{{ 'TOTAL_ITEMS' | translate }}</th>
      <td mat-cell *matCellDef="let r">{{ r.totalItems }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>
