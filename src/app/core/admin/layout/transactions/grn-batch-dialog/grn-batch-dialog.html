<h2 mat-dialog-title>Batch Details For : {{ data.productName }}</h2>
<mat-dialog-content>
  <div class="grn-batch-dialog__header">
    <button type="button" mat-stroked-button color="primary" (click)="addRow()">
      <mat-icon>add</mat-icon> Add Batch
    </button>
  </div>

  <table mat-table [dataSource]="itemBatchRows" class="admin-table">
    <ng-container matColumnDef="batchNo">
      <th mat-header-cell *matHeaderCellDef>Batch No</th>
      <td mat-cell *matCellDef="let row" [formGroup]="row">
        <input type="hidden" formControlName="batchDtlCd" />
        <input type="hidden" formControlName="grnDtlCd" />
        <mat-form-field appearance="outline" class="grn-batch-dialog__field">
          <input matInput formControlName="batchNo" />
        </mat-form-field>
      </td>
    </ng-container>
    <ng-container matColumnDef="packSize">
      <th mat-header-cell *matHeaderCellDef>Pack Size</th>
      <td mat-cell *matCellDef="let row" [formGroup]="row">
        <mat-form-field appearance="outline" class="grn-batch-dialog__field">
          <input matInput formControlName="packSize" />
        </mat-form-field>
      </td>
    </ng-container>
    <ng-container matColumnDef="mfgDate">
      <th mat-header-cell *matHeaderCellDef>MFG Date</th>

      <td mat-cell *matCellDef="let row" [formGroup]="row">
        <mat-form-field appearance="outline" class="grn-batch-dialog__field">
          <input
            matInput
            [matDatepicker]="mfgDatePicker"
            formControlName="mfgDate"
            placeholder="DD/MM/YYYY"
          />

          <mat-datepicker-toggle matIconSuffix [for]="mfgDatePicker"> </mat-datepicker-toggle>

          <mat-datepicker #mfgDatePicker> </mat-datepicker>
        </mat-form-field>
      </td>
    </ng-container>

    <ng-container matColumnDef="expiryDate">
      <th mat-header-cell *matHeaderCellDef>Expiry Date</th>

      <td mat-cell *matCellDef="let row" [formGroup]="row">
        <mat-form-field appearance="outline" class="grn-batch-dialog__field">
          <input
            matInput
            [matDatepicker]="expiryDatePicker"
            formControlName="expiryDate"
            placeholder="DD/MM/YYYY"
          />

          <mat-datepicker-toggle matIconSuffix [for]="expiryDatePicker"> </mat-datepicker-toggle>

          <mat-datepicker #expiryDatePicker> </mat-datepicker>
        </mat-form-field>
      </td>
    </ng-container>

    <ng-container matColumnDef="uomCd">
      <th mat-header-cell *matHeaderCellDef>UOM</th>
      <td mat-cell *matCellDef="let row" [formGroup]="row">
<mat-form-field appearance="outline" class="grn-batch-dialog__uom-field">
            <mat-select formControlName="uomCd">
            <mat-option [value]="null">Select UOM</mat-option>
            <mat-option *ngFor="let unit of units()" [value]="unit.unitCd">
              {{ unit.unitName }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>
    </ng-container>

    <ng-container matColumnDef="batchQty">
      <th mat-header-cell *matHeaderCellDef>{{ 'QTY' | translate }}</th>
      <td mat-cell *matCellDef="let row" [formGroup]="row">
        <mat-form-field appearance="outline" class="grn-batch-dialog__field">
          <input matInput type="number" formControlName="batchQty" />
        </mat-form-field>
      </td>
    </ng-container>

    <ng-container matColumnDef="batchRate">
      <th mat-header-cell *matHeaderCellDef>{{ 'RATE' | translate }}</th>
      <td mat-cell *matCellDef="let row" [formGroup]="row">
        <mat-form-field appearance="outline" class="grn-batch-dialog__field">
          <input matInput type="number" formControlName="batchRate" />
        </mat-form-field>
      </td>
    </ng-container>

    <ng-container matColumnDef="remove">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row; let i = index">
        <button type="button" mat-icon-button (click)="removeRow(i)" aria-label="Remove batch row">
          <mat-icon>delete_outline</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()">{{ 'CANCEL' | translate }}</button>
  <button mat-flat-button class="fp-btn-primary" (click)="confirm()">SAVE BATCHES</button>
</mat-dialog-actions>
