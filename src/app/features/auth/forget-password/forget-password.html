<section class="fp-auth fp-container">
  <div class="fp-auth__card fp-card">
    <h2 class="fp-display">{{ 'FORGOT_PASSWORD_TITLE' | translate }}</h2>

    <ng-container *ngIf="!sent; else confirmationTpl">
      <form [formGroup]="form" (ngSubmit)="submit()" class="fp-auth__form">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'MOBILE_OR_EMAIL' | translate }}</mat-label>
          <input matInput formControlName="identifier" />
        </mat-form-field>
        <button mat-flat-button class="fp-btn-primary" type="submit" [disabled]="submitting">
          {{ 'SEND_RESET_LINK' | translate }}
        </button>
      </form>
    </ng-container>
    <ng-template #confirmationTpl>
      <p>{{ 'RESET_LINK_SENT' | translate }}</p>
    </ng-template>

    <p class="fp-auth__register-hint">
      <a routerLink="/login">{{ 'BACK_TO_LOGIN' | translate }}</a>
    </p>
  </div>
</section>
