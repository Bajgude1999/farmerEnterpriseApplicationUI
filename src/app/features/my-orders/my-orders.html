<section class="fp-container fp-orders">
  <h1 class="fp-display">{{ 'MY_ORDERS' | translate }}</h1>

  <mat-tab-group (selectedIndexChange)="onTabChange($event)" animationDuration="0ms">
    <mat-tab *ngFor="let tab of tabs" [label]="('ORDER_STATUS_' + tab) | translate"></mat-tab>
  </mat-tab-group>

  <ng-container *ngIf="!loading(); else loadingTpl">
    <div class="fp-orders__list" *ngIf="filteredOrders().length; else emptyTpl">
      <div class="fp-orders__item fp-card" *ngFor="let order of filteredOrders()">
        <div class="fp-orders__item-header">
          <span class="fp-orders__number">{{ order.orderNumber }}</span>
          <span class="fp-orders__date">{{ order.placedOn | date: 'mediumDate' }}</span>
          <span class="fp-orders__status" [attr.data-status]="order.status">
            {{ ('ORDER_STATUS_' + order.status) | translate }}
          </span>
        </div>
        <div class="fp-orders__item-body">
          <div *ngFor="let item of order.items">{{ item.productName }} × {{ item.quantity }} — ₹{{ item.price }}</div>
        </div>
        <div class="fp-orders__item-footer">
          <span>{{ 'TOTAL' | translate }}: ₹{{ order.total }}</span>
        </div>
      </div>
    </div>
    <ng-template #emptyTpl>
      <app-empty-state icon="receipt_long" titleKey="NO_ORDERS_TITLE" messageKey="NO_ORDERS_MESSAGE"></app-empty-state>
    </ng-template>
  </ng-container>

  <ng-template #loadingTpl>
    <p class="fp-orders__loading">{{ 'LOADING' | translate }}...</p>
  </ng-template>
</section>
